name: V6 three-card Tachiai foundation smoke
on:
  push:
    branches: [feature/v6-three-card-tachiai]
    paths:
      - ".github/workflows/v6-opening-smoke.yml"
      - "src/kimarite/opening_v6.py"
      - "src/kimarite/models.py"
      - "tests/test_v6_opening.py"
  workflow_dispatch:
jobs:
  opening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify new opening, unchanged old Tachiai and style AI
        run: |
          python -m pytest -q tests/test_v6_opening.py tests/test_tachiai.py tests/test_v5_style_ai.py
