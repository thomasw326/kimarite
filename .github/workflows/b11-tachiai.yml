name: B11 player Tachiai focused tests

on:
  pull_request:
    paths:
      - 'src/kimarite/b11_*.py'
      - 'src/kimarite/tachiai_effects.py'
      - 'tests/test_b11_*.py'
      - '.github/workflows/b11-tachiai.yml'
  push:
    branches: [release/b11-playtest]
    paths:
      - 'src/kimarite/b11_*.py'
      - 'src/kimarite/tachiai_effects.py'
      - 'tests/test_b11_*.py'
      - '.github/workflows/b11-tachiai.yml'
  workflow_dispatch:

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate browser JavaScript syntax
        run: node --check web/client.js
      - name: Run B11 Tachiai regression tests
        run: python -m pytest -q tests/test_b11_player_opening.py tests/test_b11_player_tachiai.py tests/test_b11_tachiai_phase.py tests/test_b11_tachiai_reveals.py tests/test_b11_tachiai_public.py tests/test_b11_live_tachiai_reveals.py tests/test_b11_tachiai_reveal_equivalence.py tests/test_b11_pending_session.py tests/test_b11_tachiai_resolution.py tests/test_b11_multi_commit_effects.py tests/test_b11_live_opening.py tests/test_b11_live_session.py tests/test_b11_side_by_side_log.py tests/test_b11_committed_destinations.py tests/test_b11_grip_reduction_log.py tests/test_b11_sukuinage_win_explanation.py tests/test_b11_draw_shuffle.py tests/test_b11_result_screen_data.py tests/test_b11_all_kimarite_checks.py tests/test_b11_direct_win_explanation.py tests/test_b11_predraft_integrity.py tests/test_b11_15_bout_simulation.py tests/test_b11_kirikaeshi_optional.py tests/test_b11_tournament_tracker.py tests/test_b11_power_water_cantrip.py tests/test_b11_tournament_final.py tests/test_b11_three_stat_points.py tests/test_b11_pai_gao_preview.py tests/test_b11_finish_flavour.py tests/test_b11_hiwaza.py tests/test_b11_character_creation.py
