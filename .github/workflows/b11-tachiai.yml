name: B11 player Tachiai focused tests

on:
  pull_request:
    paths:
      - 'src/kimarite/b11_*.py'
      - 'src/kimarite/tachiai_effects.py'
      - 'tests/test_b11_*.py'
      - '.github/workflows/b11-tachiai.yml'
  push:
    branches: [release/b11-playtest]
    paths:
      - 'src/kimarite/b11_*.py'
      - 'src/kimarite/tachiai_effects.py'
      - 'tests/test_b11_*.py'
      - '.github/workflows/b11-tachiai.yml'
  workflow_dispatch:

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run B11 Tachiai regression tests
        run: python -m pytest -q tests/test_b11_player_opening.py tests/test_b11_player_tachiai.py tests/test_b11_tachiai_phase.py tests/test_b11_tachiai_reveals.py tests/test_b11_tachiai_public.py tests/test_b11_live_tachiai_reveals.py tests/test_b11_tachiai_reveal_equivalence.py
