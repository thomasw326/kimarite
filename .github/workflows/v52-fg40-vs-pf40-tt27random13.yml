name: V5.2 FG fixed40 vs PF fixed40 and Technician random13 - 2400 bouts

on:
  push:
    branches: [experiment/v52-fast-grappler-40-vs-pf40-tt27random13]
    paths:
      - ".github/workflows/v52-fg40-vs-pf40-tt27random13.yml"
      - "scripts/fast_grappler_draft40_vs_pf40_tt_random13.py"
      - "data/fast_grappler_draft40_20261012.json"
      - "src/kimarite/r21_variant_rules.py"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify approved B7 card effects and AI
        run: |
          python -m pytest -q tests/test_b7_runtime_audit.py tests/test_v51_power_additions.py tests/test_v5_shiko_playability.py
      - name: Exercise all four seating combinations with live fixed decks
        run: |
          python scripts/fast_grappler_draft40_vs_pf40_tt_random13.py run \
            --start 0 --stop 3 --output artifacts/fg40_smoke
      - name: Confirm 12 completed bouts, physical copies and fresh random opponents
        run: |
          python - <<'PY'
          import csv,json
          from collections import Counter
          from pathlib import Path
          from sys import path
          path.insert(0,"scripts")
          from fast_grappler_draft40_vs_pf40_tt_random13 import fg_snapshot
          import pressure_fighter_draft40_vs_random13 as pf

          root=Path("artifacts/fg40_smoke")
          m=json.loads((root/"manifest.json").read_text())
          assert (m["scheduled"],m["completed"],m["incomplete"])==(12,12,0),m
          assert m["fixed_fast_grappler_40"]==fg_snapshot()
          assert m["fixed_pressure_fighter_40"]==pf.snapshot()
          assert m["fixed_fast_grappler_40"]["Yorikiri"]==2
          assert sum(m["fixed_fast_grappler_40"].values())==40
          assert sum(m["fixed_pressure_fighter_40"].values())==40
          with (root/"bouts.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==12
          assert all(r["completed"]=="True" and r["winner"] and not r["error"] for r in rows),rows
          assert Counter((r["seat_a"],r["seat_b"]) for r in rows)=={
              ("Fast Grappler","Pressure Fighter"):3,
              ("Pressure Fighter","Fast Grappler"):3,
              ("Fast Grappler","The Technician"):3,
              ("The Technician","Fast Grappler"):3,
          }
          samples=set()
          for r in rows:
              for side in "ab":
                  style=r["seat_"+side]
                  picks=r[side+"_random13"]
                  if style=="The Technician":
                      cards=tuple(picks.split("; "))
                      assert len(cards)==len(set(cards))==13
                      samples.add(cards)
                  else:
                      assert picks=="",(style,picks)
          assert len(samples)>=2
          assert all(r["a_starting_kimarite"] in fg_snapshot()
                     for r in rows if r["seat_a"]=="Fast Grappler")
          print("PASS: FG40/PF40 fixed physical copies, TT 27+13, 12 mirrored bouts")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fg40-smoke
          path: artifacts/fg40_smoke
          retention-days: 30

  simulate:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run 600 mirrored bouts per shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          START=$((SHARD * 150))
          STOP=$(((SHARD + 1) * 150))
          python scripts/fast_grappler_draft40_vs_pf40_tt_random13.py run \
            --start "$START" --stop "$STOP" \
            --output "artifacts/fg40-shard-$SHARD"
          python - <<'PY'
          import csv,json
          from pathlib import Path
          folders=list(Path("artifacts").glob("fg40-shard-*"))
          assert len(folders)==1,folders
          m=json.loads((folders[0]/"manifest.json").read_text())
          assert m["scheduled"]==600 and m["completed"]==600 and m["incomplete"]==0,m
          with (folders[0]/"bouts.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==600
          assert all(r["completed"]=="True" and r["winner"] and not r["error"] for r in rows)
          print("PASS 600 complete bouts")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fg40-shard-${{ matrix.shard }}
          path: artifacts/fg40-shard-${{ matrix.shard }}/
          retention-days: 60

  report:
    needs: [smoke, simulate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: fg40-shard-*
          path: artifacts/fg40_collected
          merge-multiple: false
      - name: Verify 2400 finished, aggregate matchups and win methods
        run: |
          python scripts/fast_grappler_draft40_vs_pf40_tt_random13.py report \
            --root artifacts/fg40_collected --output artifacts/fg40_final
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/fg40_final/summary.json").read_text())
          assert x["completed"]==x["scheduled"]==2400 and x["incomplete"]==0,x
          assert all(r["completed"]==1200 for r in x["matchups"].values())
          assert len(x["fast_grappler_deck"])==30
          assert sum(x["fast_grappler_deck"].values())==40
          assert sum(x["pressure_fighter_deck"].values())==40
          print("PASS: 2,400 bouts, 2 matchups, precise fixed deck inventories")
          PY
          cat artifacts/fg40_final/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fg40-vs-pf40-tt27random13-2400-report
          path: artifacts/fg40_final/
          retention-days: 90
