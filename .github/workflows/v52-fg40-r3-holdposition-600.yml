name: V5.2 FG40 R3 Hold Position quick 600 bouts

on:
  push:
    branches: [experiment/v52-fg40-r3-holdposition-600]
    paths:
      - ".github/workflows/v52-fg40-r3-holdposition-600.yml"
      - "data/fast_grappler_draft40_20261012.json"
      - "scripts/fast_grappler_draft40_vs_pf40_tt_random13.py"
  workflow_dispatch:

jobs:
  quick-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Targeted B7 effect regressions
        run: python -m pytest -q tests/test_b7_runtime_audit.py tests/test_v51_power_additions.py tests/test_v5_shiko_playability.py
      - name: Confirm both decks and Hold Position substitution
        run: |
          python - <<'PY'
          import sys
          from collections import Counter
          sys.path.insert(0,"scripts")
          import fast_grappler_draft40_vs_pf40_tt_random13 as fg
          import pressure_fighter_draft40_vs_random13 as pf
          from kimarite.models import Side
          d=fg.fg_snapshot()
          assert sum(d.values())==40 and len(d)==30
          assert d["Hold Position"]==2 and "Immovable" not in d
          assert "Attempt Two-Handed Grip" not in d
          aliases,builder=fg.install()
          for style in ("Fast Grappler","Pressure Fighter","The Technician"):
              b=builder(style,seed=20261014)
              f=b.fighter
              inventory=[f.wrestler.starting_kimarite,f.wrestler.prepared_tachiai_card,*f.draw_pile]
              assert len(inventory)==40
              actual=Counter(aliases.get(c.name,c.name) for c in inventory)
              if style=="Fast Grappler":
                  assert actual==Counter(d),actual
              elif style=="Pressure Fighter":
                  assert actual==Counter(pf.snapshot()),actual
              else:
                  assert len(set(f.random_selected_names))==13
          print("PASS: FG 40 with 2 Hold Position, PF locked 40, TT 27+13")
          PY
      - name: Run 600 bouts (300 per opponent, both seats)
        run: |
          python scripts/fast_grappler_draft40_vs_pf40_tt_random13.py run \
            --start 0 --stop 150 --output artifacts/fg40-r3-quick
      - name: Verify and summarize matched 600 bout quick batch
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          from collections import Counter,defaultdict
          root=Path("artifacts/fg40-r3-quick")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert (m["scheduled"],m["completed"],m["incomplete"])==(600,600,0),m
          with (root/"bouts.csv").open(encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==600
          assert all(r["completed"]=="True" and r["winner"] and not r["error"] for r in rows)
          results={}
          for opponent in ("Pressure Fighter","The Technician"):
              rr=[r for r in rows if opponent in (r["seat_a"],r["seat_b"])]
              assert len(rr)==300,len(rr)
              seats=Counter(r["seat_a"] for r in rr)
              assert seats["Fast Grappler"]==seats[opponent]==150,seats
              w=sum(r["winner"]=="Fast Grappler" for r in rr)
              results[opponent]={
                  "bouts":300,"fg_wins":w,"opponent_wins":300-w,
                  "fg_win_pct":round(100*w/300,3),
                  "fg_yorikiri_finishes":sum(r["winner"]=="Fast Grappler" and r["method"]=="Yorikiri" for r in rr),
              }
          with (root/"card_counts.csv").open(encoding="utf-8",newline="") as f:
              cards=list(csv.DictReader(f))
          hold=next((r for r in cards if r["style"]=="Fast Grappler" and r["opponent"]=="ALL" and r["card"]=="Hold Position"),None)
          assert hold is not None, "Hold Position is absent from card event records"
          report={
              "total_bouts":600,
              "complete_bouts":600,
              "matchups":results,
              "hold_position":{
                  "deck_copies":int(hold["deck_copies"]),
                  "played_bouts":int(hold["played_bouts"]),
                  "played_uses":int(hold["played_uses"]),
                  "prepared_tachiai_bouts":int(hold["prepared_tachiai_bouts"]),
              },
              "deck":m["fixed_fast_grappler_40"],
              "rules":"B7 V5.2; Pressure Fighter YOR-C1; FG YOR-C3; corrected UWD/UWA",
              "seed_range":"repetitions 0..149, same as R2 2400-bout batch",
          }
          (root/"quick_summary.json").write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          lines=[
              "# Fast Grappler Hold Position quick test — 600 bouts","",
              "| Opponent | FG wins | Opp wins | FG win rate | Yorikiri finishes |",
              "|---|---:|---:|---:|---:|",
          ]
          for opponent,v in results.items():
              lines.append(f"| {opponent} | {v['fg_wins']} | {v['opponent_wins']} | {v['fg_win_pct']:.2f}% | {v['fg_yorikiri_finishes']} |")
          lines.extend(["",f"**Hold Position**: {report['hold_position']['played_bouts']} Exchange-played bouts; {report['hold_position']['prepared_tachiai_bouts']} prepared Tachiai bouts; 2 deck copies."])
          (root/"quick_summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          print("\n".join(lines))
          PY
          cat artifacts/fg40-r3-quick/quick_summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-grappler-r3-holdposition-600-report
          path: artifacts/fg40-r3-quick/
          retention-days: 90
