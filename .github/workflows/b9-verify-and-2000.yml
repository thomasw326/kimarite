name: b9-30-style-13050
on:
  pull_request:
    branches:
      - experiment/v52-fg40-r3-holdposition-600
    paths:
      - ".github/workflows/b9-30-style-13050.yml"
      - "src/kimarite/**"
      - "data/b9_*.json"
      - "scripts/b9_round_robin.py"
      - "tests/test_b9_cards.py"
  push:
    branches:
      - experiment/b9-thirty-style-roundrobin
  workflow_dispatch:

jobs:
  b9-smoke-then-2000:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile source
        run: python -m compileall -q src/kimarite scripts/b9_round_robin.py
      - name: B9 mechanical regression tests
        run: python -m pytest -q tests/test_b9_cards.py
      - name: B9 smoke across all 30 styles (180 bouts)
        run: |
          python scripts/b9_round_robin.py --bouts 180 --fail-on-errors --output-dir b9_artifacts/smoke
      - name: B9 13050-bout batch across all 435 pairings
        run: |
          python scripts/b9_round_robin.py --bouts 13050 --fail-on-errors --output-dir b9_artifacts/batch_13050_thirty_styles
      - name: Upload smoke and batch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b9-30-style-smoke-and-13050
          path: b9_artifacts/
          if-no-files-found: warn
