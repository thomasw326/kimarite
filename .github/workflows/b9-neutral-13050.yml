name: B9 13050 discard AI retest
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/b9-pull-read-move-balance
    paths:
      - .github/b9-discard-retest.trigger

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q src/kimarite scripts/b9_round_robin.py
      - run: python -m pytest -q tests/test_b9_cards.py
  round-robin:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run 2610 matched-schedule bouts
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python scripts/b9_round_robin.py --bouts 2610 --start-index $((SHARD * 2610)) --fail-on-errors --output-dir "b9_artifacts/neutral_13050_shard_${SHARD}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b9-neutral-13050-shard-${{ matrix.shard }}
          path: b9_artifacts/neutral_13050_shard_${{ matrix.shard }}/
          if-no-files-found: error
