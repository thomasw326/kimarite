name: V5.2 three wrestlers - 30000 bouts plus card audit

on:
  push:
    branches: [experiment/v52-three-style-card-audit]
    paths:
      - ".github/workflows/v52-three-style-card-audit.yml"
      - "scripts/three_style_card_audit.py"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify B7 card rules, affinity AI and representative mirrored bouts
        run: |
          python -m pytest -q tests/test_tachiai.py tests/test_r21_search.py tests/test_v5_style_ai.py tests/test_v51_power_additions.py
          python scripts/three_style_card_audit.py run --start 0 --stop 2 --output artifacts/smoke
          python - <<'PY'
          import csv, json
          from pathlib import Path
          base=Path("artifacts/smoke")
          bouts=list(csv.DictReader((base/"bouts.csv").open()))
          cards=list(csv.DictReader((base/"card_counts.csv").open()))
          info=json.loads((base/"manifest.json").read_text())
          assert len(bouts)==12
          assert all(row["completed"]=="True" and row["winner"] and not row["error"] for row in bouts),bouts
          assert len({tuple(sorted((x["seat_a"],x["seat_b"]))) for x in bouts})==3
          assert len({x["card"] for x in cards})>=50
          assert info["errors"]==0
          for style in info["roster"]:
              starts=sum(int(x["starting_kimarite_bouts"]) for x in cards if x["style"]==style and x["opponent"]=="ALL")
              assert starts==8, (style,starts)
          print("Three-style fixed rules and card coverage smoke succeeded")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-style-smoke
          path: artifacts/smoke/
          retention-days: 30

  full:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Simulate 6000 mirrored bouts and count every card
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          START=$((SHARD * 1000))
          STOP=$(((SHARD + 1) * 1000))
          python scripts/three_style_card_audit.py run \
            --start "$START" --stop "$STOP" \
            --output "artifacts/shard-$SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-style-shard-${{ matrix.shard }}
          path: artifacts/shard-${{ matrix.shard }}/
          retention-days: 30

  report:
    needs: full
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: three-style-shard-*
          path: artifacts/three_style_shards
          merge-multiple: false
      - name: Verify all 30000 results and aggregate individual card outcomes
        run: |
          python scripts/three_style_card_audit.py report \
            --root artifacts/three_style_shards \
            --output artifacts/three_style_report \
            --expected 30000
          cat artifacts/three_style_report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-style-30000-final-report
          path: artifacts/three_style_report/
          retention-days: 90
