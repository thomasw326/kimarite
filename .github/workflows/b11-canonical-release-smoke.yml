name: B11 canonical release smoke

on:
  push:
    paths:
      - 'src/kimarite/**'
      - 'data/b11_69_wrestler_decks.json'
      - 'scripts/b11_69_round_robin.py'
      - 'tests/test_b11_shitate_web_integration.py'
      - '.github/workflows/b11-canonical-release-smoke.yml'
  pull_request:
    paths:
      - 'src/kimarite/**'
      - 'data/b11_69_wrestler_decks.json'
      - 'scripts/b11_69_round_robin.py'
      - 'tests/test_b11_shitate_web_integration.py'
      - '.github/workflows/b11-canonical-release-smoke.yml'

jobs:
  validate-current-b11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Verify approved B11 gameplay, UI and Shitate replay
        run: python -m pytest -q tests/test_b11_shitate_web_integration.py tests/test_b11_all_kimarite_checks.py tests/test_shitate_family_replay.py tests/test_b11_player_draft.py
      - name: Validate all 69 base wrestler decks (28 cards)
        run: python scripts/b11_69_round_robin.py --duplicates 0 --validate-only
      - name: Validate all 69 grown wrestler decks (40 cards)
        run: python scripts/b11_69_round_robin.py --duplicates 12 --validate-only
