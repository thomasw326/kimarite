name: Full baseline comparison

on:
  push:
    paths:
      - '.github/workflows/full-baseline-compare.yml'
      - 'tests/**'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/full-baseline-compare.yml'
      - 'tests/**'
      - 'src/**'

jobs:
  compare-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Capture main baseline without masking errors
        run: |
          set +e
          python -m pytest -q > /tmp/baseline.log 2>&1
          result=$?
          cat /tmp/baseline.log
          echo "MAIN_BASELINE_EXIT_CODE=$result"
          exit 0
