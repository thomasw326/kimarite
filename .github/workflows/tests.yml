name: tests

on:
  push:
  pull_request:

jobs:
  b7-safe-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify B7 metadata and affinity invariants
        run: pytest -q tests/test_b7_safe_metadata_regression.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Test current-rule compatibility suite
        run: pytest -q -m 'not legacy_b7_drift'



  v5-kimarite-audit-r19:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 16
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run R19 V5 audit without Kimarite Exchange effects (4200 bouts)
        run: |
          python -m kimarite.kimarite_audit_v5 --repetitions 20 --max-turns 30 --seed 20261010 --disable-kimarite-exchange-effects --output artifacts/kimarite-audit-r19.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-kimarite-audit-r19
          path: artifacts/kimarite-audit-r19.json

  big-test-2:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 14
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch_id: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Execute Big Test 2 seeded round robin
        run: |
          python scripts/big_test.py \
            --batch-id ${{ matrix.batch_id }} \
            --repetitions 1 \
            --output-dir "big_test_2_artifacts/batch_${{ matrix.batch_id }}"
      - name: Save batch data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-test-2-batch-${{ matrix.batch_id }}
          path: big_test_2_artifacts/
