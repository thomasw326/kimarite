name: balance-smoke

on:
  workflow_dispatch:
    inputs:
      bouts_per_orientation:
        description: "Bouts per matchup orientation"
        required: false
        default: "10"
  push:
    paths:
      - "scripts/balance_smoke.py"
      - ".github/workflows/balance-smoke.yml"
      - "src/kimarite/**"

jobs:
  simulate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: all-minus7
            roster: all
            difficulty: -7
          - label: original-difficulty0
            roster: original
            difficulty: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run round robin
        run: |
          python scripts/balance_smoke.py \
            --bouts-per-orientation "${{ github.event.inputs.bouts_per_orientation || '10' }}" \
            --roster "${{ matrix.roster }}" \
            --difficulty "${{ matrix.difficulty }}" \
            --output-dir "balance_artifacts/${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "balance-smoke-${{ matrix.label }}"
          path: "balance_artifacts/${{ matrix.label }}/"
