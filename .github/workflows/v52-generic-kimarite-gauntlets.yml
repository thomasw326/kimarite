name: V5.2 neutral AI R20 and R21 Kimarite gauntlets
on:
  push:
    branches: [release/v5.1]
    paths: [".github/workflows/v52-generic-kimarite-gauntlets.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Confirm both gauntlets use V5.2 danger-aware AI without wrestler preferences
        run: |
          python - <<'PY'
          import inspect
          from kimarite import r20_gauntlet_bouts, r21_gauntlet_bouts
          from kimarite.style_ai_v5 import choose_style_play
          for module in (r20_gauntlet_bouts, r21_gauntlet_bouts):
              source = inspect.getsource(module.run_fixture)
              assert "play_style_turn(state, side, cmp, style=None)" in source, module.__name__
              assert "play_ai_turn(" not in source, module.__name__
          source = inspect.getsource(choose_style_play)
          assert "if style is not None else 0" in source
          assert "danger_score" in source
          print("V5.2 neutral style AI guard PASS")
          PY
      - name: Run R20 and R21 regression tests
        run: python -m pytest -q tests/test_r20_gauntlet.py tests/test_r20_variant_runtime.py tests/test_r20_gauntlet_report.py tests/test_r21_gauntlet.py tests/test_r21_search.py
      - name: Small generic gauntlet bouts from each generation
        run: |
          python -m kimarite.r20_gauntlet_bouts --arm HIK-3 --count 10 --max-turns 60 --output artifacts/neutral_smoke/r20.csv
          python -m kimarite.r21_gauntlet_bouts --count 10 --max-turns 60 --output artifacts/neutral_smoke/r21.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v52-neutral-gauntlet-smoke
          path: artifacts/neutral_smoke/

  full:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {generation: r20, shard: 0}
          - {generation: r20, shard: 1}
          - {generation: r20, shard: 2}
          - {generation: r20, shard: 3}
          - {generation: r20, shard: 4}
          - {generation: r20, shard: 5}
          - {generation: r20, shard: 6}
          - {generation: r20, shard: 7}
          - {generation: r20, shard: 8}
          - {generation: r20, shard: 9}
          - {generation: r20, shard: 10}
          - {generation: r20, shard: 11}
          - {generation: r20, shard: 12}
          - {generation: r20, shard: 13}
          - {generation: r21, shard: 0}
          - {generation: r21, shard: 1}
          - {generation: r21, shard: 2}
          - {generation: r21, shard: 3}
          - {generation: r21, shard: 4}
          - {generation: r21, shard: 5}
          - {generation: r21, shard: 6}
          - {generation: r21, shard: 7}
          - {generation: r21, shard: 8}
          - {generation: r21, shard: 9}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run original 1296-bout per-arm fixture schedule with neutral V5.2 AI
        env:
          GENERATION: ${{ matrix.generation }}
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import csv, os, pathlib, subprocess, sys
          gen=os.environ["GENERATION"]
          shard=int(os.environ["SHARD"])
          if gen=="r20":
              from kimarite.r20_gauntlet import load_arms
          else:
              from kimarite.r21_gauntlet import load_arms
          arms=load_arms()[shard*5:(shard+1)*5]
          assert len(arms)==5, (gen,shard,len(arms))
          out=pathlib.Path("artifacts/v52_neutral")/gen
          out.mkdir(parents=True,exist_ok=True)
          for arm in arms:
              path=out/(arm.arm_id+".csv")
              subprocess.run([sys.executable,"-m",f"kimarite.{gen}_gauntlet_bouts",
                  "--arm",arm.arm_id,"--count","1296","--max-turns","60",
                  "--output",str(path)],check=True)
              with path.open(newline="",encoding="utf-8") as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==1296,(arm.arm_id,len(rows))
              errors=[r for r in rows if r["error"] not in ("","Turn limit 60")]
              assert not errors,(arm.arm_id,len(errors),errors[:2])
              print(gen,arm.arm_id,"bouts",len(rows),"unresolved",
                    sum(r["completed"]!="True" for r in rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v52-neutral-${{ matrix.generation }}-shard-${{ matrix.shard }}
          path: artifacts/v52_neutral/
          retention-days: 30

  report:
    needs: [smoke,full]
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v52-neutral-*-shard-*
          path: artifacts/neutral_collected
          merge-multiple: true
      - name: Validate both complete manifests and calculate separate reports
        run: |
          python - <<'PY'
          import csv, glob
          for gen,expected in (("r20",70),("r21",50)):
              files=glob.glob(f"artifacts/neutral_collected/{gen}/*.csv")
              assert len(files)==expected,(gen,len(files),expected)
              for path in files:
                  with open(path,newline="",encoding="utf-8") as f:
                      count=sum(1 for _ in csv.DictReader(f))
                  assert count==1296,(path,count)
              print(gen,expected*1296,"records OK")
          PY
          python -m kimarite.r20_gauntlet_report artifacts/neutral_collected/r20/*.csv --output-dir artifacts/v52_reports/r20
          python -m kimarite.r21_gauntlet_report artifacts/neutral_collected/r21/*.csv --output-dir artifacts/v52_reports/r21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v52-neutral-gauntlet-reports
          path: artifacts/v52_reports/
