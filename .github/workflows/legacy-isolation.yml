name: Legacy red-test isolation

on:
  pull_request:
    paths:
      - 'tests/test_v5_style_builds.py'
      - 'src/kimarite/style_builds_v5.py'
      - '.github/workflows/legacy-isolation.yml'
  workflow_dispatch:

jobs:
  isolated-style-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test style exclusions without other test modules
        run: python -m pytest -q tests/test_v5_style_builds.py
