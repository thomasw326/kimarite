name: B6 10 Kimarite 30 basic cards - card analytics
on:
  push:
    branches: [experiment/b6-ten-kimarite-thirty-basics]
    paths: [".github/workflows/r26-affinity-full22.yml", "src/kimarite/r26_style_final22.py", "src/kimarite/style_builds_v5.py", "tests/test_tachiai.py"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Validate complete card pool, 20 selected Kimarite, AI affinity and real bout
        run: |
          python -m pytest -q tests/test_tachiai.py tests/test_r21_search.py tests/test_v5_style_ai.py tests/test_v51_power_additions.py
          python - <<'PY'
          import inspect
          from kimarite import r26_style_final22 as r26
          from kimarite.style_ai_v5 import choose_style_play
          from kimarite import style_builds_v5,style_ai_v5
          from kimarite.styles_v5 import STYLES
          r26.install_final22()
          assert len(STYLES)==15
          assert style_builds_v5.B6_FIXED_COMPOSITION_DECK
          for name in STYLES:
              build=style_builds_v5.build_style(name,seed=23)
              fighter=build.fighter
              cards=[*fighter.draw_pile,fighter.wrestler.prepared_tachiai_card]
              assert len(cards)==39,(name,len(cards))
              from collections import Counter
              counts=Counter(c.name for c in cards)
              assert len(counts)==29,(name,len(counts))
              assert sum(c.is_kimarite for c in cards)==9,(name,"draw pile Kimarite")
              assert fighter.wrestler.starting_kimarite.is_kimarite
              assert sum(c.is_kimarite for c in cards)+1==10
              assert sum(v==2 for k,v in counts.items() if not any(c.name==k and c.is_kimarite for c in cards))==10
              assert not any(v>1 for k,v in counts.items() if any(c.name==k and c.is_kimarite for c in cards))
              assert sorted(counts.values())==[1]*19+[2]*10,(name,counts)
              assert len({c.card_id for c in cards})==39,(name,"duplicate physical IDs")
              assert fighter.wrestler.starting_kimarite.card_id not in {c.card_id for c in cards}
          assert len(style_builds_v5.STARTING_KIMARITE)==20
          banned={"Abisetaoshi","Kirikaeshi"}
          assert banned.isdisjoint({c.name for c in style_builds_v5.CARD_POOL})
          assert banned.isdisjoint({c.name for c in style_builds_v5.STARTING_KIMARITE})
          for style in STYLES:
              opening=style_builds_v5.preferred(style_builds_v5.STARTING_KIMARITE,style,3)
              assert len(opening)==3 and len({c.name for c in opening})==3
              assert banned.isdisjoint({c.name for c in opening})
          assert "card_affinity(style, candidate.card.name)" in inspect.getsource(choose_style_play)
          for name in ("Driving Force — Power Payoff","Crushing Pressure — Power Crusher"):
              assert any(c.name==name for c in style_builds_v5.CARD_POOL)
              assert any(style_ai_v5.card_affinity(s,name)!=0 for s in STYLES)
          assert any(style_ai_v5.card_affinity(s,"R21:R21-R25-UWD-M2-EX")!=0 for s in STYLES)
          print("15 affinity profiles + final22 + new power cards pass")
          PY
          python -m kimarite.r26_style_final22 --start-pair 0 --end-pair 1 --repetitions 1 --output artifacts/r26_smoke.csv
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open("artifacts/r26_smoke.csv")))
          assert len(rows)==2
          assert all(r["completed"]=="True" and not r["error"] for r in rows),rows
          card_rows=list(csv.DictReader(open("artifacts/r26_smoke_cards.csv")))
          assert card_rows and any(r["kind"]=="played" for r in card_rows),card_rows[:5]
          print("R26 mirrored smoke passed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b6-smoke
          path: |
            artifacts/r26_smoke.csv
            artifacts/r26_smoke_cards.csv

  full:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2,3,4,5,6]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run 3600 mirrored affinity bouts per shard, full final22 deck
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p artifacts/r26
          python - <<'PY'
          import os,subprocess,sys
          shard=int(os.environ["SHARD"])
          subprocess.run([sys.executable,"-m","kimarite.r26_style_final22",
              "--start-pair",str(shard*15),"--end-pair",str((shard+1)*15),
              "--repetitions","120","--seed","20261011",
              "--max-turns","100","--output",f"artifacts/r26/shard-{shard}.csv"],check=True)
          PY
          python - <<'PY'
          import csv,glob
          files=glob.glob("artifacts/r26/shard-*.csv")
          assert len(files)==1
          rows=list(csv.DictReader(open(files[0])))
          assert len(rows)==3600
          assert not [r for r in rows if r["completed"]!="True" or r["error"]],[r for r in rows if r["completed"]!="True" or r["error"]][:3]
          detail=glob.glob("artifacts/r26/shard-*_cards.csv")
          assert len(detail)==1
          with open(detail[0],newline="") as h: card_rows=list(csv.DictReader(h))
          assert card_rows and all(r["card"] for r in card_rows)
          print("3600 bouts plus card-level rows verified",len(card_rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b6-shard-${{ matrix.shard }}
          path: artifacts/r26/
          retention-days: 30

  report:
    needs: [smoke,full]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: b6-shard-*
          path: artifacts/r26_collected
          merge-multiple: true
      - name: Verify 15-style 25200 complete mirrored bouts and summarize
        run: |
          python - <<'PY'
          import csv,glob,collections,json
          files=glob.glob("artifacts/r26_collected/shard-[0-9].csv")
          assert len(files)==7,len(files)
          rows=[]
          for f in files:
              with open(f,newline="") as h: rows.extend(csv.DictReader(h))
          assert len(rows)==25200,len(rows)
          assert all(x["completed"]=="True" and not x["error"] for x in rows)
          per_style=collections.Counter()
          wins=collections.Counter()
          methods=collections.Counter()
          for x in rows:
              per_style[x["seat_a"]]+=1
              per_style[x["seat_b"]]+=1
              wins[x["winner"]]+=1
              methods[x["win_method"]]+=1
          assert len(per_style)==15
          assert all(v==3360 for v in per_style.values()),per_style
          result={"bouts":len(rows),"win_rates":{s:round(wins[s]/per_style[s],4) for s in per_style},
                  "wins":dict(wins),"finishes":dict(methods),"sample_per_style":dict(per_style)}
          import pathlib
          pathlib.Path("artifacts/r26_report").mkdir(parents=True,exist_ok=True)
          pathlib.Path("artifacts/r26_report/summary.json").write_text(json.dumps(result,indent=2))
          # Card-conditioned win rate: P(win | selected/seen/played card).
          # Distinct bouts, not duplicate plays, are the denominator.
          card_files=glob.glob("artifacts/r26_collected/shard-*_cards.csv")
          assert len(card_files)==7,len(card_files)
          metrics=collections.defaultdict(lambda:[0,0,0])
          for file in card_files:
              with open(file,newline="") as handle:
                  seen=set()
                  for rec in csv.DictReader(handle):
                      key=(rec["style"],rec["card"],rec["kind"],file,rec["pair"],rec["repetition"],rec["seat_a"],rec["seat_b"])
                      if key in seen: continue
                      seen.add(key)
                      bucket=metrics[(rec["style"],rec["card"],rec["kind"])]
                      bucket[0]+=1
                      bucket[1]+=int(rec["won"])
                      bucket[2]+=int(rec["count"])
          output=pathlib.Path("artifacts/r26_report/card_win_rates.csv")
          with output.open("w",newline="") as handle:
              writer=csv.writer(handle)
              writer.writerow(("style","card","event","bouts_with_event","wins_with_event","win_rate","total_occurrences"))
              for (style,card,event),(n,w,occ) in sorted(metrics.items()):
                  writer.writerow((style,card,event,n,w,round(w/n,5),occ))
          result["card_analytics"]={"records":sum(v[0] for v in metrics.values()),"rows":len(metrics),"file":str(output)}
          pathlib.Path("artifacts/r26_report/summary.json").write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b6-final-report
          path: artifacts/r26_report/
