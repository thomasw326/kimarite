name: R23 five orange orb removals V5.2 neutral AI
on:
  push:
    branches: [experiment/r23-five-orange-orb-removals]
    paths: [".github/workflows/r23-five-orb-removals.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify five R23 changes, neutral V5.2 AI and Search
        run: |
          python - <<'PY'
          import json, inspect
          from kimarite.r21_gauntlet import load_arms,generic_roster
          from kimarite.r21_gauntlet_bouts import run_fixture
          from kimarite.r21_variant_rules import build_variant_card
          from kimarite.style_ai_v5 import choose_style_play
          from kimarite.r21_search import search_draw_pile_first
          data=json.load(open("data/r23_kimarite_roster.json"))
          assert len(data["arms"])==5 and len(set(data["arms"]))==5
          arms={a.arm_id:a for a in load_arms()}
          assert len({arms[x].kimarite for x in data["arms"]})==5
          for ident,orbs in data["expected_orbs"].items():
              assert arms[ident].orbs==orbs
              card=build_variant_card(ident,card_id=70000)
              assert (card.power,card.technique,card.spirit)==(orbs.count("🟣"),orbs.count("🟢"),orbs.count("🟠"))
              assert card.spirit==0
          assert len(generic_roster())==108
          assert "play_style_turn(state, side, cmp, style=None)" in inspect.getsource(run_fixture)
          assert "if style is not None else 0" in inspect.getsource(choose_style_play)
          assert "danger_score" in inspect.getsource(choose_style_play)
          assert "fighter.draw_pile.pop(index)" in inspect.getsource(search_draw_pile_first)
          print("R23 roster/AI/orb/search checks PASSED")
          PY
          python -m pytest -q tests/test_r21_search.py tests/test_r20_variant_runtime.py
          python -m kimarite.r21_gauntlet_bouts --arm R21-SHI-C3 --count 10 --max-turns 60 --output artifacts/r23_smoke.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r23-smoke
          path: artifacts/r23_smoke.csv

  full:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm: [R21-SHI-C3, R21-R22-TSO-2, R21-R22-UWD-3, R21-KIR-P3-HA3, R21-UWA-C1-M2]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run 1296 R22-matched fixtures per R23 build
        env:
          ARM: ${{ matrix.arm }}
        run: |
          mkdir -p artifacts/r23
          python -m kimarite.r21_gauntlet_bouts --arm "$ARM" --count 1296 --max-turns 60 --seed 20261010 --output "artifacts/r23/$ARM.csv"
          python - <<'PY'
          import csv,glob
          files=glob.glob("artifacts/r23/*.csv")
          assert len(files)==1
          with open(files[0],newline="") as stream:
              rows=list(csv.DictReader(stream))
          assert len(rows)==1296
          assert sum(r["placement"]=="starting" for r in rows)==648
          assert sum(r["placement"]=="shuffled" for r in rows)==648
          assert all(r["completed"]=="True" and not r["error"] for r in rows)
          print("1296 R23 bouts passed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r23-${{ matrix.arm }}
          path: artifacts/r23/
          retention-days: 30

  report:
    needs: [smoke,full]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: r23-R21-*
          path: artifacts/r23_collected
          merge-multiple: true
      - name: Verify five build reports
        run: |
          python - <<'PY'
          import json,csv,glob,os
          expected=json.load(open("data/r23_kimarite_roster.json"))["arms"]
          files=glob.glob("artifacts/r23_collected/*.csv")
          assert len(files)==5,(len(files),files)
          assert {os.path.basename(f)[:-4] for f in files}==set(expected)
          total=0
          for f in files:
              with open(f,newline="") as stream:
                  rows=list(csv.DictReader(stream))
              assert len(rows)==1296,(f,len(rows))
              total+=len(rows)
          assert total==6480
          print("R23 five-build / 6480 bout data confirmed")
          PY
          python -m kimarite.r21_gauntlet_report artifacts/r23_collected/*.csv --output-dir artifacts/r23_report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r23-five-build-final-report
          path: artifacts/r23_report/
