name: B11 69-wrestler validation

on:
  push:
    paths:
      - 'data/b11_69_wrestler_decks.json'
      - 'scripts/b11_69_round_robin.py'
      - 'src/kimarite/kimarite.py'
      - 'src/kimarite/b11_victory_checks.py'
      - 'src/kimarite/b10_card_info.py'
      - 'tests/test_b11_recent_kimarite_fixes.py'
      - '.github/workflows/b11-69-wrestler-validation.yml'
  workflow_dispatch:

jobs:
  validate-69-decks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Run focused B11 card and victory checks
        run: python -m pytest -q tests/test_b11_recent_kimarite_fixes.py tests/test_b11_all_kimarite_checks.py tests/test_b10_card_info.py
      - name: Validate all 69 base decks (28 cards)
        run: python scripts/b11_69_round_robin.py --duplicates 0 --validate-only
      - name: Validate all 69 maximum decks (40 cards)
        run: python scripts/b11_69_round_robin.py --duplicates 12 --validate-only
      - name: Run complete 69-wrestler mirrored round robin (maximum decks)
        run: python scripts/b11_69_round_robin.py --duplicates 12 --bouts 4692 --output-dir artifacts/b11_69_max
      - name: Run complete 69-wrestler mirrored round robin (base decks)
        run: python scripts/b11_69_round_robin.py --duplicates 0 --bouts 4692 --output-dir artifacts/b11_69_base
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b11-69-wrestler-smoke
          path: artifacts/b11_69_*/
