name: V5.2 seven designer Kimarite revisions
on:
  push:
    branches: [experiment/v52-seven-candidate-retest]
    paths: [".github/workflows/v52-seven-candidate-retest.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify isolated seven candidate definitions and regressions
        run: |
          python -m pytest -q tests/test_r21_search.py tests/test_r20_variant_runtime.py
          # The original R21 test fixes the HISTORICAL manifest at 50 arms;
          # this isolated candidate branch intentionally adds seven.
          python - <<'PY'
          from kimarite.r21_gauntlet import load_arms
          from kimarite.r21_variant_rules import build_variant_card
          arms={a.arm_id:a for a in load_arms()}
          candidates=("R21-OKD-RS","R21-OKT-RS","R21-UTC-F2-MN2",
                      "R21-UWA-C1-M2","R21-KIR-P3-HA3","R21-KAT-H5-T2",
                      "R21-HIK-C2-MN3")
          assert all(k in arms for k in candidates)
          assert arms["R21-UTC-F2-MN2"].orbs == "🟢🟢"
          assert arms["R21-KAT-H5-T2"].orbs == "🟢🟢"
          for k in candidates:
              assert build_variant_card(k,card_id=50505).name=="R21:"+k
          print("SEVEN CANDIDATE RULE CHECKS PASS")
          PY
          python -m kimarite.r21_gauntlet_bouts --arm R21-OKD-RS --count 10 --max-turns 60 --output artifacts/smoke.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-revisions-smoke
          path: artifacts/smoke.csv

  full:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm: [R21-OKD-RS, R21-OKT-RS, R21-UTC-F2-MN2, R21-UWA-C1-M2, R21-KIR-P3-HA3, R21-KAT-H5-T2, R21-HIK-C2-MN3]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run paired generic R21 fixtures with neutral V5.2 AI
        env:
          ARM: ${{ matrix.arm }}
        run: |
          mkdir -p artifacts/seven_revisions
          python -m kimarite.r21_gauntlet_bouts --arm "$ARM" --count 1296 --max-turns 60 --seed 20261010 --output "artifacts/seven_revisions/$ARM.csv"
          python - <<'PY'
          import csv,glob
          paths=glob.glob("artifacts/seven_revisions/*.csv")
          assert len(paths)==1
          rows=list(csv.DictReader(open(paths[0],newline="")))
          assert len(rows)==1296,len(rows)
          assert all(r["completed"]=="True" and not r["error"] for r in rows),sum(r["completed"]!="True" or bool(r["error"]) for r in rows)
          print("1296 bouts verified",paths[0])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-revisions-${{ matrix.arm }}
          path: artifacts/seven_revisions/
          retention-days: 30

  report:
    needs: [smoke,full]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: seven-revisions-R21-*
          path: artifacts/combined
          merge-multiple: true
      - name: Check all seven arms and create win and finish reports
        run: |
          python - <<'PY'
          import csv,glob
          files=glob.glob("artifacts/combined/*.csv")
          assert len(files)==7,(len(files),files)
          for file in files:
              with open(file,newline="") as stream:
                  rows=list(csv.DictReader(stream))
              assert len(rows)==1296,(file,len(rows))
          print("9072 bouts verified")
          PY
          python -m kimarite.r21_gauntlet_report artifacts/combined/*.csv --output-dir artifacts/seven_report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-revisions-final-reports
          path: artifacts/seven_report/
