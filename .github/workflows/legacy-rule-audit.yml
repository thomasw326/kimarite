name: Legacy-rule test audit (manual only)

on:
  workflow_dispatch:

jobs:
  historical-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run retired historical assertions explicitly
        run: pytest -q -m legacy_b7_drift
