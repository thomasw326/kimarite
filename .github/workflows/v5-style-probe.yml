name: v5-style-probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v5-integration-controller
    paths:
      - .github/workflows/v5-style-probe.yml
      - src/kimarite/style_ai_v5.py
      - src/kimarite/style_builds_v5.py
      - src/kimarite/style_simulate_v5.py
      - src/kimarite/style_round_robin_v5.py

jobs:
  round-robin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run mirrored 15-style probe (840 bouts)
        run: |
          mkdir -p artifacts
          python -m kimarite.style_round_robin_v5 --repetitions 4 --max-turns 30 > artifacts/style-probe.json
          cat artifacts/style-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: v5-style-probe
          path: artifacts/style-probe.json
