name: B8 Mountain Grip Defense Restored - 1000
on:
  push:
    branches: [experiment/b8-mountain-grip-defense-1000]
    paths:
      - .github/workflows/b8-mountain-grip-defense-1000.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify locked four unchanged and Mountain counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from kimarite.rules import POSITION_MIN, POSITION_MAX
          source = json.loads(Path("data/b7_charger_four_fixed40.json").read_text())["decks"]
          trial = json.loads(Path("data/b8_mountain_ankogata_tsuriotoshi_1000.json").read_text())["decks"]
          assert (POSITION_MIN, POSITION_MAX)==(-4,4)
          assert {n:d for n,d in trial.items() if n!="Mountain"}==source
          assert set(trial)=={*source,"Mountain"}
          assert all(sum(deck.values())==40 for deck in trial.values())
          mountain=trial["Mountain"]
          assert mountain["Ankogata"]==2 and mountain["Tsuriotoshi"]==1
          assert "Tottari" not in mountain and mountain["Ottsuke"]==mountain["Kannuki"]==2
          assert mountain["Shove"]==1 and "Belt Slap" not in mountain
          assert trial["Pressure Fighter"]["Morotsuki"]==2
          assert trial["Charger"]["Morotsuki"]==1
          print("PASS: Four locked B8 decks unchanged; Mountain 40; ±4/+5 ring-out")
          PY
      - name: New cards exact gameplay canaries
        run: python scripts/b8_mountain_new_cards_canary.py
      - name: Existing B8 duplicate Kimarite guard
        run: python -m pytest -q tests/test_duplicate_kimarite_canary.py
      - name: Smoke 8 bouts vs four, both seats
        run: python scripts/b8_mountain_ankogata_tsuriotoshi_1000.py --start 0 --stop 1 --output artifacts/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b8-mountain-gripdef-smoke
          path: artifacts/smoke/

  shards:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run 200 Mountain bouts per shard
        run: |
          START=$(( ${{ matrix.shard }} * 25 ))
          STOP=$(( START + 25 ))
          python scripts/b8_mountain_ankogata_tsuriotoshi_1000.py --start "$START" --stop "$STOP" --output "artifacts/shard_${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b8-mountain-gripdef-shard-${{ matrix.shard }}
          path: artifacts/shard_${{ matrix.shard }}/

  report:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: b8-mountain-gripdef-shard-*
          path: combined/
      - name: Verify 1000 and compare to previous Mountain baseline
        run: python scripts/b8_mountain_ankogata_tsuriotoshi_report.py --input combined --output final/
      - uses: actions/upload-artifact@v4
        with:
          name: b8-mountain-gripdef-final
          path: final/
