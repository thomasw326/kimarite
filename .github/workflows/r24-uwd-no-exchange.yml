name: R24 Uwatedashinage no Exchange V5.2 neutral
on:
  push:
    branches: [experiment/r24-uwatedashinage-no-exchange]
    paths: [".github/workflows/r24-uwd-no-exchange.yml"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Assert exact change, neutral tactical AI, and Search regressions
        run: |
          python -m pytest -q tests/test_r21_search.py tests/test_r20_variant_runtime.py
          python - <<'PY'
          import inspect
          from kimarite.r21_gauntlet import load_arms
          from kimarite.r21_gauntlet_bouts import run_fixture
          from kimarite.r21_variant_rules import variant_exchange,build_variant_card
          from kimarite.style_ai_v5 import choose_style_play
          arms={a.arm_id:a for a in load_arms()}
          old=arms["R21-R22-UWD-3"]
          new=arms["R21-R24-UWD-NE"]
          assert old.orbs==new.orbs=="🟢🟢"
          assert old.win_text==new.win_text
          assert new.exchange_text=="EXCHANGE: None"
          assert "if identifier == \"R21-R24-UWD-NE\":" in inspect.getsource(variant_exchange)
          assert "play_style_turn(state, side, cmp, style=None)" in inspect.getsource(run_fixture)
          assert "if style is not None else 0" in inspect.getsource(choose_style_play)
          assert build_variant_card(new.arm_id,card_id=60000).spirit==0
          print("R24 isolated comparison checks pass")
          PY
          python -m kimarite.r21_gauntlet_bouts --arm R21-R24-UWD-NE --count 10 --max-turns 60 --output artifacts/r24_smoke.csv
  full:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run exact matched 1296 R23 fixtures
        run: |
          mkdir -p artifacts/r24
          python -m kimarite.r21_gauntlet_bouts --arm R21-R24-UWD-NE --count 1296 --max-turns 60 --seed 20261010 --output artifacts/r24/UWD-NE.csv
          python - <<'PY'
          import csv
          with open("artifacts/r24/UWD-NE.csv",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==1296
          for placement in ("starting","shuffled"):
              subset=[r for r in rows if r["placement"]==placement]
              assert len(subset)==648
              assert all(r["completed"]=="True" and not r["error"] for r in subset)
              wins=sum(r["subject_won"]=="True" for r in subset)
              finishes=sum(r["finished_by_tested_kimarite"]=="True" for r in subset)
              print(placement,wins,"/",648,"=",round(wins/648*100,2),"%","direct finishes",finishes)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r24-uwd-no-exchange-raw
          path: artifacts/r24/
  report:
    needs: [smoke,full]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: r24-uwd-no-exchange-raw
          path: artifacts/r24
      - run: python -m kimarite.r21_gauntlet_report artifacts/r24/*.csv --output-dir artifacts/r24_report
      - uses: actions/upload-artifact@v4
        with:
          name: r24-uwd-no-exchange-report
          path: artifacts/r24_report/
