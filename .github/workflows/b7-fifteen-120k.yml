name: B7 Reviewed 13 Styles 91k
on:
  push:
    branches:
      - experiment/b7-thirteen-reviewed-91k
  workflow_dispatch:
  pull_request:
    branches: [main]


jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: 'Canary test: duplicate Kimarite grants a Play'
        run: python -m pytest -q tests/test_duplicate_kimarite_canary.py
      - name: Smoke the 13-style grid
        run: python scripts/b7_fifteen_fixed40_roundrobin.py --start 0 --stop 1 --output artifacts/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b7-thirteen-reviewed-smoke
          path: artifacts/smoke/

  shards:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run 18200 bouts per shard
        run: |
          START=$(( ${{ matrix.shard }} * 100 ))
          STOP=$(( START + 100 ))
          python scripts/b7_fifteen_fixed40_roundrobin.py --start "$START" --stop "$STOP" --output "artifacts/shard_${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b7-thirteen-reviewed-shard-${{ matrix.shard }}
          path: artifacts/shard_${{ matrix.shard }}/

  report:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: b7-thirteen-reviewed-shard-*
          path: combined/
      - name: Verify and aggregate 91000 bouts
        run: python scripts/b7_fifteen_fixed40_report.py --input combined --output final/
      - uses: actions/upload-artifact@v4
        with:
          name: b7-thirteen-reviewed-91k-final
          path: final/
