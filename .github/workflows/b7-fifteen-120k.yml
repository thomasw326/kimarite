name: B7 Fifteen Fixed40 Round Robin 120k
on:
  push:
    branches:
      - experiment/b7-fifteen-fixed40-roundrobin
    paths:
      - .github/workflows/b7-fifteen-120k.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Smoke the 15-style grid
        run: pytest -q tests/test_b7_fifteen_fixed40_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b7-fifteen-smoke
          path: artifacts/smoke/

  shards:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run 24000 bouts per shard
        run: |
          START=$(( ${{ matrix.shard }} * 100 ))
          STOP=$(( START + 100 ))
          python scripts/b7_fifteen_fixed40_roundrobin.py --start "$START" --stop "$STOP" --output "artifacts/shard_${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b7-fifteen-shard-${{ matrix.shard }}
          path: artifacts/shard_${{ matrix.shard }}/

  report:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: b7-fifteen-shard-*
          path: combined/
      - name: Verify and aggregate 120000 bouts
        run: python scripts/b7_fifteen_fixed40_report.py --input combined --output final/
      - uses: actions/upload-artifact@v4
        with:
          name: b7-fifteen-120k-final
          path: final/
