name: B7 Mountain Five 1200
on:
  push:
    branches:
      - experiment/b7-mountain-five-1200
  workflow_dispatch:
  pull_request:
    branches: [main]


jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: 'Canary test: duplicate Kimarite grants a Play'
        run: python -m pytest -q tests/test_duplicate_kimarite_canary.py
      - name: Smoke the five-style grid
        run: python scripts/b7_mountain_five_fixed40_roundrobin.py --start 0 --stop 1 --output artifacts/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b7-mountain-five-smoke
          path: artifacts/smoke/

  shards:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run 1200 bouts
        run: |
          START=0
          STOP=40
          python scripts/b7_mountain_five_fixed40_roundrobin.py --start "$START" --stop "$STOP" --output "artifacts/shard_${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b7-mountain-five-shard-${{ matrix.shard }}
          path: artifacts/shard_${{ matrix.shard }}/

  report:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: b7-mountain-five-shard-*
          path: combined/
      - name: Verify and aggregate 1200 bouts
        run: python scripts/b7_mountain_five_fixed40_report.py --input combined --output final/
      - uses: actions/upload-artifact@v4
        with:
          name: b7-mountain-five-1200-final
          path: final/
