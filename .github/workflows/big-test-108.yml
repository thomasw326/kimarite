name: big-test-108

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/big_test.py
      - .github/workflows/big-test-108.yml

jobs:
  big-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: Check personality mode
        run: python -m pytest -q tests/test_personality_ai.py
      - name: Full mirrored 108 configuration sweep
        run: python scripts/big_test.py --repetitions 1 --output-dir big_test_artifacts
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-test-108-results
          path: big_test_artifacts/
