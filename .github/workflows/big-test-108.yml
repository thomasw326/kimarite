name: big-test-108

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/big_test.py
      - .github/workflows/big-test-108.yml
      - src/kimarite/personality_ai.py

jobs:
  big-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch_id: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: Check personality mode
        run: python -m pytest -q tests/test_personality_ai.py
      - name: Validate randomized setup
        run: python -m pytest -q tests/test_big_test.py
      - name: Run one independent complete round robin
        run: |
          python scripts/big_test.py \
            --batch-id ${{ matrix.batch_id }} \
            --repetitions 1 \
            --output-dir "big_test_artifacts/batch_${{ matrix.batch_id }}"
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-test-108-batch-${{ matrix.batch_id }}
          path: big_test_artifacts/
