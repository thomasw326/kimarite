name: Mountain evolution pilot
on:
  push:
    branches: [experiment/mountain-evolution-pilot]
    paths: ['.github/workflows/mountain-evolution-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/b12_60_big_test.py --mode max40 --validate-only
      - name: Smoke test
        run: python scripts/b12_mountain_evolution.py --smoke --output artifacts/mountain_smoke
      - name: Eight generation pilot
        run: python scripts/b12_mountain_evolution.py --generations 8 --mutations 16 --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mountain-evolution-results
          path: artifacts/mountain*/
          if-no-files-found: warn
