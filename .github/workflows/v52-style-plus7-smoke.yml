name: V5.2 style-aware +7 smoke test

on:
  push:
    branches: [release/v5.1]
    paths:
      - ".github/workflows/v52-style-plus7-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify current style AI and six-axis card catalog
        run: |
          python - <<'PY'
          from kimarite.catalog import CARD_POOL
          from kimarite.affinity_v5 import affinity
          from kimarite.styles_v5 import STYLES
          from kimarite.style_ai_v5 import choose_style_play
          import inspect
          assert len(STYLES) == 15
          for name in ("Driving Force — Power Payoff", "Crushing Pressure — Power Crusher"):
              assert any(c.name == name for c in CARD_POOL), name
              assert any(affinity(style, name) != 0 for style in STYLES), name
          assert "card_affinity(style, candidate.card.name)" in inspect.getsource(choose_style_play)
          print("V5.2 style AI + affinity: PASS")
          PY
      - name: Run 630 fully mirrored bouts at difficulty +7
        run: python scripts/styles_test.py --difficulty 7 --repetitions 3 --seed 20261011 --max-turns 100 --output-dir artifacts/v52_style_plus7_smoke
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v52-style-aware-plus7-630-bouts
          path: artifacts/v52_style_plus7_smoke/
