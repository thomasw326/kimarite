name: staging-http-smoke

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "Dockerfile"
      - "scripts/staging_http_smoke.py"
      - ".github/workflows/staging-http-smoke.yml"
  workflow_dispatch:

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify hosted draft-first UI and live B11 bout
        run: python scripts/staging_http_smoke.py --url https://kimarite-b12-alpha-preview.onrender.com
