name: B11 Shitate replay smoke

on:
  push:
    paths:
      - 'src/kimarite/**'
      - 'tests/test_shitate_family_replay.py'
      - '.github/workflows/shitate-replay-smoke.yml'
  pull_request:
    paths:
      - 'src/kimarite/**'
      - 'tests/test_shitate_family_replay.py'
      - '.github/workflows/shitate-replay-smoke.yml'

jobs:
  shitate-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify Shitate win conditions, Recover and exhaust-safe replay
        run: python -m pytest -q tests/test_shitate_family_replay.py tests/test_kimarite_effects.py
