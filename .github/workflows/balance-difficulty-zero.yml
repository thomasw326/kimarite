name: balance-difficulty-zero

on:
  workflow_dispatch:
    inputs:
      bouts_per_orientation:
        description: "Bouts per matchup orientation"
        required: false
        default: "3"
  push:
    paths:
      - ".github/workflows/balance-difficulty-zero.yml"

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run original-15 Difficulty 0 round robin
        run: |
          python scripts/balance_smoke.py             --roster original             --difficulty 0             --bouts-per-orientation "${{ github.event.inputs.bouts_per_orientation || '3' }}"             --output-dir balance_difficulty_zero
      - uses: actions/upload-artifact@v4
        with:
          name: balance-difficulty-zero
          path: balance_difficulty_zero/
