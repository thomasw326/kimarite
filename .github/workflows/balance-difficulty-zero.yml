name: balance-difficulty-zero

on:
  workflow_dispatch:
    inputs:
      bouts_per_orientation:
        description: "Bouts per matchup orientation"
        required: false
        default: "10"
  push:
    paths:
      - ".github/workflows/balance-difficulty-zero.yml"
      - "scripts/balance_smoke.py"
      - "src/kimarite/ai.py"
      - "src/kimarite/batch.py"
      - "src/kimarite/effects.py"
      - "src/kimarite/kimarite.py"
      - "src/kimarite/kimarite_effects.py"
      - "src/kimarite/rules.py"
      - "src/kimarite/selection.py"
      - "src/kimarite/simulate.py"
      - "src/kimarite/temporary.py"
      - "src/kimarite/setup.py"
      - "src/kimarite/models.py"
      - "src/kimarite/tachiai.py"
      - "src/kimarite/turns.py"

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run original-15 Difficulty 0 round robin
        run: |
          python scripts/balance_smoke.py             --roster original             --difficulty 0             --bouts-per-orientation "${{ github.event.inputs.bouts_per_orientation || '10' }}"             --output-dir balance_difficulty_zero
      - uses: actions/upload-artifact@v4
        with:
          name: balance-difficulty-zero
          path: balance_difficulty_zero/
