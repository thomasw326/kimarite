name: B8 Mountain vs Locked Four 1000
on:
  push:
    branches: [experiment/b8-mountain-vs-four-1000]
    paths:
      - .github/workflows/b8-mountain-vs-four-1000.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify locked four unchanged and B8 rules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from kimarite.rules import POSITION_MIN, POSITION_MAX
          source = json.loads(Path("data/b7_charger_four_fixed40.json").read_text())["decks"]
          trial = json.loads(Path("data/b8_mountain_vs_four_1000.json").read_text())["decks"]
          assert (POSITION_MIN, POSITION_MAX) == (-4, 4)
          assert {n:d for n,d in trial.items() if n != "Mountain"} == source
          assert set(trial) == {*source, "Mountain"}
          assert all(sum(deck.values()) == 40 for deck in trial.values())
          assert trial["Pressure Fighter"]["Morotsuki"] == 2
          assert trial["Charger"]["Morotsuki"] == 1
          print("PASS: Four B8 decks unchanged; experimental Mountain 40; ring ±4/out ±5")
          PY
      - name: Gameplay canary
        run: python -m pytest -q tests/test_duplicate_kimarite_canary.py
      - name: Smoke 8 bouts (four opponents, two seats)
        run: python scripts/b8_mountain_vs_four_1000.py --start 0 --stop 1 --output artifacts/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b8-mountain-four-smoke
          path: artifacts/smoke/

  shards:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run 200 Mountain-versus-four bouts
        run: |
          START=$(( ${{ matrix.shard }} * 25 ))
          STOP=$(( START + 25 ))
          python scripts/b8_mountain_vs_four_1000.py --start "$START" --stop "$STOP" --output "artifacts/shard_${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b8-mountain-four-shard-${{ matrix.shard }}
          path: artifacts/shard_${{ matrix.shard }}/

  report:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: b8-mountain-four-shard-*
          path: combined/
      - name: Verify, aggregate and summarize the 1000 bouts
        run: python scripts/b8_mountain_vs_four_1000_report.py --input combined --output final/
      - uses: actions/upload-artifact@v4
        with:
          name: b8-mountain-four-1000-final
          path: final/
