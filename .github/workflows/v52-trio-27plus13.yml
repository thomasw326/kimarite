name: V5.2 trio - 30000 bouts - 27 guaranteed + 13 freshly random

on:
  push:
    branches: [experiment/v52-trio-core27-random13]
    paths:
      - ".github/workflows/v52-trio-27plus13.yml"
      - "scripts/three_style_random13_audit.py"
      - "data/three_style_curated_27.json"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Check core lock, random sampling and existing V5 rules
        run: |
          python -m pytest -q tests/test_tachiai.py tests/test_v5_style_ai.py
          python scripts/three_style_random13_audit.py run --start 0 --stop 2 --output artifacts/smoke
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          p=Path("artifacts/smoke")
          d=json.loads(Path("data/three_style_curated_27.json").read_text())["cards"]
          alias=lambda name: "Explosive Step — Fumikomi" if name=="Explosive Step" else name
          core={s:set(map(alias,cards)) for s,cards in d.items()}
          assert set(map(len,d.values()))=={27}
          rows=list(csv.DictReader((p/"bouts.csv").open()))
          metrics=list(csv.DictReader((p/"card_counts.csv").open()))
          assert len(rows)==12
          random_samples={s:set() for s in core}
          for row in rows:
            assert row["completed"]=="True",row
            for prefix in ("a","b"):
              style=row["seat_"+prefix]
              sample=row[prefix+"_random_cards"].split("; ")
              assert len(sample)==len(set(sample))==13, (style,sample)
              assert not core[style].intersection(sample),(style,sample)
              random_samples[style].add(tuple(sample))
          assert all(len(samples)>1 for samples in random_samples.values()),random_samples
          for style in core:
            core_n=sum(int(x["core_bouts"]) for x in metrics
                       if x["style"]==style and x["opponent"]=="ALL")
            random_n=sum(int(x["random_bouts"]) for x in metrics
                         if x["style"]==style and x["opponent"]=="ALL")
            assert core_n==27*8,(style,core_n)
            assert random_n==13*8,(style,random_n)
          print("PASSED: 27 locked + 13 independently rerolled per wrestler per bout")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trio-27plus13-smoke
          path: artifacts/smoke/
          retention-days: 30

  simulate:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run 6000 paired V5.2 bouts with separately sampled 13 random cards
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          START=$((SHARD * 1000))
          STOP=$(((SHARD + 1) * 1000))
          python scripts/three_style_random13_audit.py run --start "$START" --stop "$STOP" --output "artifacts/shard-$SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trio-27plus13-shard-${{ matrix.shard }}
          path: artifacts/shard-${{ matrix.shard }}/
          retention-days: 60

  report:
    needs: simulate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: trio-27plus13-shard-*
          path: artifacts/three_style_shards
          merge-multiple: false
      - name: Aggregate 30000 scheduled bouts and card origin data
        run: |
          python scripts/three_style_random13_audit.py report --root artifacts/three_style_shards --output artifacts/final --expected 30000
          cat artifacts/final/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trio-27plus13-30000-report
          path: artifacts/final/
          retention-days: 90
