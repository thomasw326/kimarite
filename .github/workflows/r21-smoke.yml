name: R21 integration smoke

on:
  push:
    branches:
      - experiment/r21-kimarite-retest
    paths:
      - src/kimarite/r21_**
      - src/kimarite/playing.py
      - src/kimarite/kimarite.py
      - src/kimarite/ai.py
      - tests/test_r21_gauntlet.py
      - data/r21_kimarite_arms.json
      - .github/workflows/r21-smoke.yml
  workflow_dispatch:

concurrency:
  group: r21-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: R21 arm, condition, deck-search and integration tests
        run: python -m pytest -q tests/test_r21_search.py tests/test_r21_gauntlet.py tests/test_r20_variant_runtime.py tests/test_r20_gauntlet.py
      - name: Eight R21 sample batches (both placements)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r21_smoke
          for arm in R21-HIK-RS R21-KIR-H3 R21-KAT-NG R21-UTC-P1; do
            for placement in starting shuffled; do
              if [ "$placement" = starting ]; then offset=0; else offset=648; fi
              python -m kimarite.r21_gauntlet_bouts --arm "$arm" --start "$offset" --count 20 --max-turns 60 --output "artifacts/r21_smoke/${arm}_${placement}.csv"
            done
          done
          python - <<'PY'
          import csv, glob
          paths=glob.glob("artifacts/r21_smoke/*.csv")
          assert len(paths)==8,paths
          for path in paths:
              with open(path,newline='',encoding='utf-8') as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==20,(path,len(rows))
              bad=[r for r in rows if r["error"] not in ("", "Turn limit 60")]
              assert not bad,(path,bad[:3])
          print("R21 smoke passed; 160 recorded bouts")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r21-integration-smoke
          path: artifacts/r21_smoke
          retention-days: 30
