name: B10 approved baseline 26 wrestler 30-match round robin
on:
  push:
    branches:
      - test/b10-26-wrestlers-30-per-pair
    paths:
      - .github/workflows/b10-26-wrestler-9750.yml
  pull_request:
    paths:
      - .github/workflows/b10-26-wrestler-9750.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src/kimarite scripts/b9_round_robin.py
      - name: Verify 26 participants and 30 bouts per pairing
        run: |
          python - <<'PY'
          import json
          from itertools import combinations
          from pathlib import Path
          names = list(json.loads(Path("data/b9_30_wrestler_decks.json").read_text())["decks"])
          exclusions = {"Attrition Fighter", "Disruptor", "Gripless Fighter", "Stability Master"}
          participants = [n for n in names if n not in exclusions]
          assert len(names) == 30 and len(participants) == 26
          assert len(list(combinations(participants, 2))) == 325
          print(f"Roster 26, pairings 325, bouts 9750, each wrestler 750")
          PY

  round-robin:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run 1950 bouts on 26-wrestler roster
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          readarray -d '' -t ROSTER < <(python - <<'PY'
          import json, sys
          from pathlib import Path
          names = list(json.loads(Path("data/b9_30_wrestler_decks.json").read_text())["decks"])
          for name in names:
              if name not in {"Attrition Fighter", "Disruptor", "Gripless Fighter", "Stability Master"}:
                  sys.stdout.buffer.write(name.encode() + b"\0")
          PY
          )
          python scripts/b9_round_robin.py \
            --bouts 1950 \
            --start-index $((SHARD * 1950)) \
            --roster-names "${ROSTER[@]}" \
            --fail-on-errors \
            --output-dir "b10_artifacts/roster26_shard_${SHARD}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b10-26-roster-9750-shard-${{ matrix.shard }}
          path: b10_artifacts/roster26_shard_${{ matrix.shard }}/
          if-no-files-found: error
