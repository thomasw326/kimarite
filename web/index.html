<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#182a2d"><title>Kimarite · Practice Bout</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="eyebrow">KIMARITE · SUMO CARD GAME</div><h1>Practice Bout</h1></header><main>
<section class="setup panel"><label>Your rikishi<select id="human"></select></label><label>Opponent<select id="opponent"></select></label><label>Opening setup<select id="opening-mode"><option value="choose">Choose cards</option><option value="auto">Automatic (simulation)</option></select></label><div id="opening-picks" class="opening-picks"><label>Starting Kimarite<select id="pick-kimarite"></select></label><label>Prepared Tachiai<select id="pick-prepared"></select></label><label>First draw card<select id="pick-top"></select></label></div><button id="start">Begin bout</button></section>
<section class="arena panel"><div class="eyebrow" id="round">THE DOHYŌ</div><div class="dohyo"><div class="shikiri"></div><span class="rikishi left">●</span><span class="rikishi right">●</span></div><div id="tracks" class="tracks"></div></section>
<section class="panel"><details id="opening-details"><summary><strong>Opening setup & Tachiai orbs</strong></summary><div id="opening"></div></details></section>
<section id="score" class="score panel" aria-live="polite"></section>
<section class="panel"><details open><summary><strong>Bout history — what happened</strong></summary><div class="history-tools"><button id="copy-history" type="button">Copy log</button><span id="copy-status" role="status" aria-live="polite"></span></div><div id="history" class="history"></div></details></section>
<section id="choices" class="choice panel" aria-live="polite"></section>
<section class="play panel"><div class="playtop"><h2>Your hand</h2><button id="end" disabled>End turn</button></div><div id="hand" class="cards"></div></section>
<p id="notice" role="status"></p><dialog id="end-confirm"><h2>End your turn?</h2><p id="end-confirm-message"></p><div class="confirm-actions"><button id="continue-playing" type="button">Yes, continue playing</button><button id="confirm-end-turn" type="button">No, end turn anyway</button></div></dialog><dialog id="inspect"><div class="inspect-head"><h2 id="inspect-name"></h2><button id="inspect-close" type="button">Close</button></div><p id="inspect-orbs"></p><p id="inspect-effect"></p><div id="inspect-actions"></div></dialog></main>
<script src="/client.js"></script></body></html>
